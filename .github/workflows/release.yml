name: Release

# Push a tag like v2.2.0 to build EasyRes.exe on Windows and publish a
# GitHub release with it attached. Tags with a suffix (v2.2.0-rc1) are
# published as pre-releases, which the in-app updater ignores.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, e.g. v2.2.0 or v2.2.0-rc1"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Validate tag
        shell: bash
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$ ]]; then
            echo "Invalid tag: $TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow

      - name: Check tag matches CURRENT_VERSION
        shell: bash
        run: |
          version=$(python -c "import updater; print(updater.CURRENT_VERSION)")
          tag="${TAG#v}"
          if [ "${tag%%-*}" != "$version" ]; then
            echo "Tag $TAG does not match CURRENT_VERSION $version" >&2
            exit 1
          fi

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build EasyRes.exe
        shell: bash
        run: |
          extra=""
          if [ -d assets ]; then extra='--add-data assets;assets'; fi
          pyinstaller --clean --noupx --noconsole --onefile --uac-admin \
            --icon icon.png --add-data "icon.png;." $extra main.py --name EasyRes

      - name: Smoke test EasyRes.exe
        shell: pwsh
        run: |
          $log = Join-Path $env:LOCALAPPDATA "EasyRes\crash.log"
          $env:EASYRES_SMOKE_SECONDS = "8"
          $p = Start-Process -FilePath dist\EasyRes.exe -PassThru
          $finished = $p.WaitForExit(90000)
          if (-not $finished) { Stop-Process -Id $p.Id -Force }
          if (Test-Path $log) { Get-Content $log }
          if (-not $finished -or $p.ExitCode -ne 0 -or -not (Select-String -Path $log -Pattern "SMOKE OK" -Quiet)) {
            throw "EasyRes.exe failed to start; not publishing."
          }

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$TAG" in *-*) pre="--prerelease";; esac
          gh release create "$TAG" dist/EasyRes.exe --target "$GITHUB_SHA" \
            --title "EasyRes $TAG" --generate-notes $pre
