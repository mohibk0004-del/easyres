name: Release

# Push a tag like v2.2.0 to build EasyRes.exe on Windows and publish a
# GitHub release with it attached. Tags with a suffix (v2.2.0-rc1) are
# published as pre-releases, which the in-app updater ignores.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow

      - name: Check tag matches CURRENT_VERSION
        shell: bash
        run: |
          version=$(python -c "import updater; print(updater.CURRENT_VERSION)")
          tag="${GITHUB_REF_NAME#v}"
          if [ "${tag%%-*}" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CURRENT_VERSION $version" >&2
            exit 1
          fi

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build EasyRes.exe
        shell: bash
        run: |
          extra=""
          if [ -d assets ]; then extra='--add-data assets;assets'; fi
          pyinstaller --clean --noupx --noconsole --onefile --uac-admin \
            --icon icon.png --add-data "icon.png;." $extra main.py --name EasyRes

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""
          case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" dist/EasyRes.exe \
            --title "EasyRes $GITHUB_REF_NAME" --generate-notes $pre
