name: Windows smoke test

# Builds EasyRes.exe exactly like the release and launches it on Windows,
# failing if it doesn't start. Prints the app's crash log either way.
on:
  push:
    branches:
      - "claude/**"
      - main
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pillow

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Build EasyRes.exe
        shell: bash
        run: |
          extra=""
          if [ -d assets ]; then extra='--add-data assets;assets'; fi
          pyinstaller --clean --noupx --noconsole --onefile --uac-admin \
            --icon icon.png --add-data "icon.png;." $extra main.py --name EasyRes

      - name: Launch EasyRes.exe
        shell: pwsh
        run: |
          $env:EASYRES_SMOKE_SECONDS = "10"
          $log = Join-Path $env:LOCALAPPDATA "EasyRes\crash.log"
          $p = Start-Process -FilePath dist\EasyRes.exe -PassThru
          $finished = $p.WaitForExit(90000)
          if (-not $finished) { Stop-Process -Id $p.Id -Force; "RESULT: timed out" }
          else { "RESULT: exit code $($p.ExitCode)" }
          "----- crash.log -----"
          if (Test-Path $log) { Get-Content $log } else { "(no crash.log at $log)" }
          if (-not $finished -or $p.ExitCode -ne 0 -or -not (Select-String -Path $log -Pattern "SMOKE OK" -Quiet)) {
            exit 1
          }
